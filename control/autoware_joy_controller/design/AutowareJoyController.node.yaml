autoware_system_design_format: 0.3.0
# node information
name: AutowareJoyController.node
package:
  name: autoware_joy_controller
  provider: autoware
launch:
  plugin: autoware::joy_controller::AutowareJoyControllerNode
  executable: autoware_joy_controller
# interfaces
subscribers:
  - name: joy
    message_type: sensor_msgs/msg/Joy
    remap_target: input/joy
  - name: odometry
    message_type: nav_msgs/msg/Odometry
    remap_target: input/odometry
  - name: operation_mode_state
    message_type: autoware_adapi_v1_msgs/msg/OperationModeState
    remap_target: input/operation_mode_state
publishers:
  - name: control_command
    message_type: autoware_control_msgs/msg/Control
    remap_target: output/control_command
  - name: external_control_command
    message_type: tier4_external_api_msgs/msg/ControlCommandStamped
    remap_target: output/external_control_command
  - name: gear
    message_type: autoware_adapi_v1_msgs/msg/GearCommand
    remap_target: output/gear
  - name: turn_indicators
    message_type: autoware_adapi_v1_msgs/msg/TurnIndicatorsCommand
    remap_target: output/turn_indicators
  - name: hazard_lights
    message_type: autoware_adapi_v1_msgs/msg/HazardLightsCommand
    remap_target: output/hazard_lights
  - name: heartbeat
    message_type: autoware_adapi_v1_msgs/msg/ManualOperatorHeartbeat
    remap_target: output/heartbeat
clients:
  - name: mrm_request
    message_type: autoware_adapi_v1_msgs/srv/SendMrmRequest
    remap_target: service/mrm_request
  - name: change_to_local
    message_type: autoware_adapi_v1_msgs/srv/ChangeOperationMode
    remap_target: service/change_to_local
  - name: change_to_stop
    message_type: autoware_adapi_v1_msgs/srv/ChangeOperationMode
    remap_target: service/change_to_stop
  - name: change_to_autonomous
    message_type: autoware_adapi_v1_msgs/srv/ChangeOperationMode
    remap_target: service/change_to_autonomous
  - name: enable_autoware_control
    message_type: autoware_adapi_v1_msgs/srv/ChangeOperationMode
    remap_target: service/enable_autoware_control
  - name: disable_autoware_control
    message_type: autoware_adapi_v1_msgs/srv/ChangeOperationMode
    remap_target: service/disable_autoware_control
# parameters
param_files:
  - name: joy_controller_param
    default: config/joy_controller_ds4.param.yaml
param_values: []
# processes
processes:
  - name: publish_joy_commands
    trigger_conditions:
      - periodic: 10.0 # Hz
    outcomes:
      - to_output: control_command
      - to_output: external_control_command
      - to_output: gear
      - to_output: turn_indicators
      - to_output: hazard_lights
      - to_output: heartbeat
